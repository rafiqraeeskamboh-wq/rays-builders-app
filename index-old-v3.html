  document.getElementById("sn-save").addEventListener("click", async () => {
    const errEl = document.getElementById("sn-error");
    try {
      await api("/api/suppliers", { method: "POST", body: { name: document.getElementById("sn-name").value, phone: document.getElementById("sn-phone").value } });
      renderSuppliers();
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = "block";
    }
  });
}

async function renderSupplierDetail(id) {
  const { supplier, ledger, balance } = await api(`/api/suppliers/${id}`);
  const rows = [...ledger].reverse().map((l) => `
    <div class="row-between" style="padding:6px 0;border-bottom:1px solid var(--border)">
      <div>
        <div style="font-weight:600;font-size:13px">${escapeHtml(l.note || (l.type === "charge" ? "Purchase" : "Payment"))}</div>
        <div style="font-size:11px;color:var(--text-muted)">${l.date}</div>
      </div>
      <strong style="color:${l.type === "charge" ? "var(--red)" : "var(--green)"}">${l.type === "charge" ? "+" : "-"}${fmtRs(l.amount)}</strong>
    </div>
  `).join("");
  const html = `
    <div class="card">
      <div class="row-between">
        <div>
          <strong style="font-size:16px">${escapeHtml(supplier.name)}</strong>
          <p style="font-size:12px;color:var(--text-muted);margin:2px 0 0">${escapeHtml(supplier.phone || "")}</p>
        </div>
        <a href="#/vouchers?partyType=supplier&partyId=${supplier.id}&partyName=${encodeURIComponent(supplier.name)}" class="secondary" style="padding:8px 12px;border:1px solid var(--border);border-radius:8px;text-decoration:none;color:inherit;font-size:13px">Payment Dein</a>
      </div>
      <div class="total-box" style="margin-top:10px;background:var(--amber-light);color:#7a5a10"><span>Baqaya (Dena Hai)</span><span>${fmtRs(balance)}</span></div>
    </div>
    <div class="card">
      <p class="card-title">Ledger</p>
      ${rows || '<p class="center-msg">Koi entry nahi.</p>'}
    </div>
  `;
  shell(html, "/suppliers");
}

// ---------- VOUCHERS ----------
async function renderVoucherNew(query) {
  const [{ customers }, { suppliers }, { vouchers }] = await Promise.all([
    api("/api/customers"), api("/api/suppliers"), api("/api/vouchers"),
  ]);
  const presetType = query && query.partyType;
  const presetId = query && query.partyId;
  const presetName = query && query.partyName;

  const custOptions = customers.map((c) => `<option value="${c.id}" ${presetType === "customer" && String(presetId) === String(c.id) ? "selected" : ""}>${escapeHtml(c.name)} (${fmtRs(c.balance)})</option>`).join("");
  const supOptions = suppliers.map((s) => `<option value="${s.id}" ${presetType === "supplier" && String(presetId) === String(s.id) ? "selected" : ""}>${escapeHtml(s.name)} (${fmtRs(s.balance)})</option>`).join("");

  const recent = vouchers.slice(0, 15);

  const html = `
    <div class="card">
      <p class="card-title">Receipt / Payment Voucher</p>
      <div class="type-toggle">
        <button class="v-type-btn active receipt" data-type="receipt">Receipt (Wasooli)</button>
        <button class="v-type-btn payment" data-type="payment">Payment (Ada)</button>
      </div>
      <label>Party Type</label>
      <select id="v-party-type">
        <option value="customer" ${presetType !== "supplier" ? "selected" : ""}>Customer</option>
        <option value="supplier" ${presetType === "supplier" ? "selected" : ""}>Supplier</option>
        <option value="other">General / Other</option>
      </select>
      <div id="v-customer-wrap">
        <label>Customer</label>
        <select id="v-customer-select"><option value="">-- Select --</option>${custOptions}</select>
      </div>
      <div id="v-supplier-wrap" style="display:none">
        <label>Supplier</label>
        <select id="v-supplier-select"><option value="">-- Select --</option>${supOptions}</select>
      </div>
      <div id="v-other-wrap" style="display:none">
        <label>Naam</label>
        <input id="v-other-name" placeholder="Party ka naam (optional)" />
      </div>
      <label>Amount</label>
      <input type="number" id="v-amount" placeholder="0" />
      <label>Method</label>
      <select id="v-method">
        <option value="cash">Cash</option>
        <option value="bank">Bank</option>
      </select>
      <label>Note (optional)</label>
      <input id="v-note" placeholder="Tafseel" />
      <p class="error-text" id="v-error" style="display:none"></p>
      <button class="primary" id="v-save">Voucher Save Karein</button>
    </div>
    <div class="card">
      <p class="card-title">Recent Vouchers</p>
      ${recent.length === 0 ? '<p class="center-msg">Koi voucher nahi.</p>' : recent.map((v) => `
        <div class="row-between" style="padding:6px 0;border-bottom:1px solid var(--border)">
          <div>
            <div style="font-weight:600;font-size:13px">#${v.voucherNo} - ${escapeHtml(v.partyName || "General")}</div>
            <div style="font-size:11px;color:var(--text-muted)">${v.date} &middot; ${v.type === "receipt" ? "Receipt" : "Payment"} &middot; ${v.method}</div>
          </div>
          <strong style="color:${v.type === "receipt" ? "var(--green)" : "var(--red)"}">${fmtRs(v.amount)}</strong>
        </div>
      `).join("")}
    </div>
  `;
  shell(html, "/vouchers");

  let currentType = "receipt";
  document.querySelectorAll(".v-type-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".v-type-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      currentType = btn.dataset.type;
    });
  });

  const partyTypeEl = document.getElementById("v-party-type");
  const custWrap = document.getElementById("v-customer-wrap");
  const supWrap = document.getElementById("v-supplier-wrap");
  const otherWrap = document.getElementById("v-other-wrap");
  function togglePartyWrap() {
    custWrap.style.display = partyTypeEl.value === "customer" ? "block" : "none";
    supWrap.style.display = partyTypeEl.value === "supplier" ? "block" : "none";
    otherWrap.style.display = partyTypeEl.value === "other" ? "block" : "none";
  }
  partyTypeEl.addEventListener("change", togglePartyWrap);
  togglePartyWrap();
  if (presetType === "supplier") { document.querySelectorAll(".v-type-btn").forEach((b) => b.classList.remove("active")); document.querySelector('.v-type-btn[data-type="payment"]').classList.add("active"); currentType = "payment"; }

  document.getElementById("v-save").addEventListener("click", async () => {
    const errEl = document.getElementById("v-error");
    errEl.style.display = "none";
    const partyType = partyTypeEl.value;
    let partyId = null, partyName = "";
    if (partyType === "customer") {
      const sel = document.getElementById("v-customer-select");
      partyId = sel.value || null;
      partyName = sel.selectedOptions[0] ? sel.selectedOptions[0].textContent.replace(/\s*\(Rs[^)]*\)$/, "") : "";
    } else if (partyType === "supplier") {
      const sel = document.getElementById("v-supplier-select");
      partyId = sel.value || null;
      partyName = sel.selectedOptions[0] ? sel.selectedOptions[0].textContent.replace(/\s*\(Rs[^)]*\)$/, "") : "";
    } else {
      partyName = document.getElementById("v-other-name").value;
    }
    const amount = Number(document.getElementById("v-amount").value) || 0;
    try {
      await api("/api/vouchers", {
        method: "POST",
        body: { type: currentType, partyType, partyId, partyName, amount, method: document.getElementById("v-method").value, note: document.getElementById("v-note").value },
      });
      navigate(partyType === "customer" && partyId ? `#/customers/${partyId}` : partyType === "supplier" && partyId ? `#/suppliers/${partyId}` : "#/vouchers");
      if (!(partyId)) renderVoucherNew({});
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = "block";
    }
  });
}

// ---------- DAY BOOK ----------
async function renderDayBook(query) {
  const date = (query && query.date) || todayStr();
  const { rows } = await api(`/api/daybook?date=${date}`);
  const totalIn = rows.filter((r) => r.direction === "in").reduce((s, r) => s + r.amount, 0);
  const totalOut = rows.filter((r) => r.direction === "out").reduce((s, r) => s + r.amount, 0);
  const rowsHtml = rows.map((r) => `
    <div class="row-between" style="padding:6px 0;border-bottom:1px solid var(--border)">
      <div>
        <div style="font-weight:600;font-size:13px">${escapeHtml(r.label)}</div>
        <div style="font-size:11px;color:var(--text-muted)">${escapeHtml(r.detail || "")}</div>
      </div>
      <strong style="color:${r.direction === "in" ? "var(--green)" : "var(--red)"}">${r.direction === "in" ? "+" : "-"}${fmtRs(r.amount)}</strong>
    </div>
  `).join("");
  const html = `
    <div class="card">
      <p class="card-title">Day Book</p>
      <input type="date" id="db-date" value="${date}" />
    </div>
    <div class="card">
      <div class="row-between"><span>Total In</span><strong style="color:var(--green)">${fmtRs(totalIn)}</strong></div>
      <div class="row-between" style="margin-top:6px"><span>Total Out</span><strong style="color:var(--red)">${fmtRs(totalOut)}</strong></div>
    </div>
    <div class="card">
      ${rowsHtml || '<p class="center-msg">Is din koi entry nahi.</p>'}
    </div>
  `;
  shell(html, "/daybook");

  document.getElementById("db-date").addEventListener("change", (e) => {
    navigate(`#/daybook?date=${e.target.value}`);
  });
}

// ---------- CASH BOOK ----------
async function renderCashBook() {
  const { rows, totalIn, totalOut, balance } = await api("/api/cashbook");
  const rowsHtml = [...rows].reverse().map((r) => `
    <div class="row-between" style="padding:6px 0;border-bottom:1px solid var(--border)">
      <div>
        <div style="font-weight:600;font-size:13px">#${r.voucherNo} - ${escapeHtml(r.partyName || "General")}</div>
        <div style="font-size:11px;color:var(--text-muted)">${r.date} &middot; ${r.type === "receipt" ? "Receipt" : "Payment"}</div>
      </div>
      <div style="text-align:right">
        <strong style="color:${r.type === "receipt" ? "var(--green)" : "var(--red)"}">${r.type === "receipt" ? "+" : "-"}${fmtRs(r.amount)}</strong>
        <div style="font-size:11px;color:var(--text-muted)">Balance: ${fmtRs(r.runningBalance)}</div>
      </div>
    </div>
  `).join("");
  const html = `
    <div class="card">
      <p class="card-title">Cash Book</p>
      <div class="row-between"><span>Total In</span><strong style="color:var(--green)">${fmtRs(totalIn)}</strong></div>
      <div class="row-between" style="margin-top:6px"><span>Total Out</span><strong style="color:var(--red)">${fmtRs(totalOut)}</strong></div>
      <div class="total-box" style="margin-top:10px"><span>Cash Balance</span><span>${fmtRs(balance)}</span></div>
    </div>
    <div class="card">
      ${rowsHtml || '<p class="center-msg">Koi cash voucher nahi.</p>'}
    </div>
  `;
  shell(html, "/cashbook");
}

// ---------- ROUTER ----------
async function route() {
  const { path, query } = parseHash();

  if (!CURRENT_USER) {
    try {
      const data = await api("/api/auth/me");
      CURRENT_USER = data.user;
    } catch (e) {}
  }

  if (path !== "/login" && !CURRENT_USER) { renderLogin(); return; }
  if (path === "/login" && CURRENT_USER) { navigate("#/dashboard"); return; }

  try {
    if (path === "/login") return renderLogin();
    if (path === "/dashboard" || path === "/") return await renderDashboard();
    if (path === "/bills/new") return await renderBillNew(query.type);
    if (path === "/bills") return await renderBillsList();
    const billDetailMatch = path.match(/^\/bills\/(\d+)$/);
    if (billDetailMatch) return await renderBillDetail(Number(billDetailMatch[1]));
    if (path === "/stock") return await renderStock();
    if (path === "/labour") return await renderLabour();
    if (path === "/admin/users") return await renderAdminUsers();
    if (path === "/reports") return await renderReports();
    if (path === "/scan") return await renderScan();
    if (path === "/settings") return await renderSettings();
    if (path === "/accounts") return await renderAccountsHub();
    if (path === "/customers") return await renderCustomers();
    const custDetailMatch = path.match(/^\/customers\/(\d+)$/);
    if (custDetailMatch) return await renderCustomerDetail(Number(custDetailMatch[1]));
    if (path === "/suppliers") return await renderSuppliers();
    const supDetailMatch = path.match(/^\/suppliers\/(\d+)$/);
    if (supDetailMatch) return await renderSupplierDetail(Number(supDetailMatch[1]));
    if (path === "/vouchers") return await renderVoucherNew(query);
    if (path === "/daybook") return await renderDayBook(query);
    if (path === "/cashbook") return await renderCashBook();
    navigate("#/dashboard");
  } catch (e) {
    root.innerHTML = `<div class="app-shell"><div class="content"><p class="error-text">${escapeHtml(e.message)}</p></div></div>`;
  }
}

window.addEventListener("hashchange", route);
window.addEventListener("DOMContentLoaded", () => {
  seedIfEmpty();
  route();
});
</script>
